<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAFFA Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fcf9f9; font-family: 'Cairo', sans-serif; color: #4a4042; margin: 0; padding: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: #d89b9f; }
        .cart-btn { background: none; border: none; font-size: 20px; cursor: pointer; position: relative; color: #4a4042; }
        .badge { position: absolute; top: -8px; right: -8px; background: #d89b9f; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: 700; }
        .hero { text-align: center; padding: 25px 15px; background: #fcecee; }
        .hero h2 { font-size: 26px; margin-bottom: 5px; color: #4a4042; }
        .banner-box { max-width: 450px; margin: 20px auto; padding: 0 15px; text-align: center; }
        .banner-box img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 20px; box-shadow: 0 8px 25px rgba(216, 155, 159, 0.25); }
        .categories { display: flex; gap: 12px; overflow-x: auto; padding: 10px 15px; justify-content: center; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
        .cat-card { background: #fff; border-radius: 15px; width: 130px; text-align: center; padding: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.04); flex-shrink: 0; transition: transform 0.2s; border: 2px solid transparent; }
        .cat-card:hover { transform: translateY(-3px); border-color: #d89b9f; }
        .cat-card img { width: 100%; height: 90px; object-fit: cover; border-radius: 10px; }
        .cat-name { font-size: 13px; font-weight: 700; margin-top: 8px; color: #4a4042; }
        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; }
        .p-title { font-size: 15px; font-weight: 600; margin: 10px 0 5px 0; }
        .p-price { color: #d89b9f; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
        .add-btn { background: #f4d1d4; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; font-family: 'Cairo'; color: #4a4042; transition: background 0.2s; }
        .add-btn:hover { background: #e5b9bd; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: #fff; width: 100%; max-width: 420px; padding: 25px; border-radius: 20px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .form-control { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Cairo'; box-sizing: border-box; font-size: 14px; }
        .checkout-btn { width: 100%; background: #d89b9f; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-family: 'Cairo'; font-size: 15px; margin-top: 10px; }
        .checkout-btn:hover { background: #c7888c; }
        footer { background-color: #4a4042; color: white; text-align: center; padding: 25px; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">DAFFA <span>Store</span></div>
        <button class="cart-btn" onclick="toggleModal(true)">
            <i class="fas fa-shopping-bag"></i>
            <span class="badge" id="cartCount">0</span>
        </button>
    </header>

    <div class="hero">
        <h2>متجر DAFFA 🌸</h2>
        <p style="font-size: 14px; color: #7a6b6e;">عالمك الخاص من الجمال والأناقة</p>
    </div>

    <!-- البانر الرئيسي -->
    <div class="banner-box">
        <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?q=80&w=600&auto=format&fit=crop" alt="Banner">
    </div>

    <!-- الأقسام -->
    <div class="categories">
        <div class="cat-card" onclick="filterPrs('Perfumes')">
            <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=400&auto=format&fit=crop" alt="Perfumes">
            <div class="cat-name">Perfumes</div>
        </div>
        <div class="cat-card" onclick="filterPrs('Pajamas')">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=400&auto=format&fit=crop" alt="Pajamas">
            <div class="cat-name">Pajamas</div>
        </div>
        <div class="cat-card" onclick="filterPrs('Body Splash')">
            <img src="https://images.unsplash.com/photo-1608248597359-915b31f7983b?q=80&w=400&auto=format&fit=crop" alt="Body Splash">
            <div class="cat-name">Body Splash</div>
        </div>
        <div class="cat-card" onclick="filterPrs('Accessories')">
            <img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?q=80&w=400&auto=format&fit=crop" alt="Accessories">
            <div class="cat-name">Accessories</div>
        </div>
        <div class="cat-card" onclick="filterPrs('Mugs')">
            <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=400&auto=format&fit=crop" alt="Mugs">
            <div class="cat-name">Mugs</div>
        </div>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="secTitle" style="font-size: 20px; color: #4a4042;">Featured Products</h3>
            <button onclick="filterPrs('All')" style="background: none; border: 1px solid #d89b9f; color: #d89b9f; padding: 5px 15px; border-radius: 15px; cursor: pointer; font-family: 'Cairo'; font-weight: 600;">عرض الكل</button>
        </div>
        <div class="grid" id="productGrid"></div>
    </div>

    <!-- نافذة السلة والطلب -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f7f0f1; padding-bottom: 10px;">
                <h3 style="font-size: 18px;">سلة المشتريات وإتمام الطلب</h3>
                <button onclick="toggleModal(false)" style="background:none; border:none; font-size:22px; cursor:pointer; color:#7a6b6e;">&times;</button>
            </div>
            <div id="cartItems" style="margin-bottom: 15px; font-size: 14px; max-height: 150px; overflow-y: auto;">السلة فارغة حالياً</div>
            <div id="cartTotal" style="font-weight: 700; margin-bottom: 15px; font-size: 15px; text-align: left;">الإجمالي: 0 ج.م</div>
            
            <form onsubmit="orderDone(event)">
                <input type="text" class="form-control" id="cName" placeholder="الاسم بالكامل" required>
                <input type="tel" class="form-control" id="cPhone1" placeholder="رقم الهاتف الأساسي" required>
                <input type="tel" class="form-control" id="cPhone2" placeholder="رقم الهاتف الثاني للتأكيد" required>
                <select class="form-control" id="cGov" required>
                    <option value="">اختر المحافظة</option>
                    <option value="القاهرة">القاهرة</option>
                    <option value="الجيزة">الجيزة</option>
                    <option value="الإسكندرية">الإسكندرية</option>
                    <option value="الدقهلية">الدقهلية</option>
                    <option value="الشرقية">الشرقية</option>
                    <option value="القليوبية">القليوبية</option>
                    <option value="أسيوط">أسيوط</option>
                    <option value="سوهاج">سوهاج</option>
                    <option value="أخرى">محافظة أخرى</option>
                </select>
                <input type="text" class="form-control" id="cAddress" placeholder="العنوان بالتفصيل (الشارع - العمارة - الدور)" required>
                <select class="form-control" disabled style="background-color: #f7f0f1;">
                    <option>طريقة الدفع: محفظة إلكترونية / فودافون كاش</option>
                </select>
                <button type="submit" class="checkout-btn">تأكيد الطلب الآن 🛍️</button>
            </form>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © DAFFA Store 2026 💖</p>
    </footer>

    <script>
        const db = [
            { id: 1, name: 'عطر كيالي فانيلا كاندي', cat: 'Perfumes', price: 350, img: 'https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=400&auto=format&fit=crop' },
            { id: 2, name: 'عطر فانيلا ناعم مركز', cat: 'Perfumes', price: 380, img: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=400&auto=format&fit=crop' },
            { id: 3, name: 'بيجامة قطن حريرية ناعمة', cat: 'Pajamas', price: 450, img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=400&auto=format&fit=crop' },
            { id: 4, name: 'بيجامة شتوي منزلية', cat: 'Pajamas', price: 420, img: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=400&auto=format&fit=crop' },
            { id: 5, name: 'بادي سبلاش جوز الهند الكريمي', cat: 'Body Splash', price: 250, img: 'https://images.unsplash.com/photo-1608248597359-915b31f7983b?q=80&w=400&auto=format&fit=crop' },
            { id: 6, name: 'بادي سبلاش فانيلا كاندي', cat: 'Body Splash', price: 270, img: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?q=80&w=400&auto=format&fit=crop' },
            { id: 7, name: 'مجموعة اكسسوارات رقيقة', cat: 'Accessories', price: 180, img: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?q=80&w=400&auto=format&fit=crop' },
            { id: 8, name: 'سلسلة رقيقة مرصعة', cat: 'Accessories', price: 200, img: 'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=400&auto=format&fit=crop' },
            { id: 9, name: 'مج قهوة بنوتي مميز', cat: 'Mugs', price: 150, img: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=400&auto=format&fit=crop' },
            { id: 10, name: 'مج حراري بتصميم أنيق', cat: 'Mugs', price: 190, img: 'https://images.unsplash.com/photo-1577805947697-89e18249d767?q=80&w=400&auto=format&fit=crop' }
        ];

        let cart = [];

        function filterPrs(cat) {
            const grid = document.getElementById('productGrid');
            const title = document.getElementById('secTitle');
            grid.innerHTML = '';
            let list = cat === 'All' ? db : db.filter(p => p.cat === cat);
            title.innerText = cat === 'All' ? 'Featured Products' : `قسم ${cat}`;
            
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="p-title">${p.name}</div>
                        <div class="p-price">${p.price} ج.م</div>
                        <button class="add-btn" onclick="add(${p.id})">أضف للسلة</button>
                    </div>
                `;
            });
        }

        function add(id) {
            let item = db.find(p => p.id === id);
            cart.push(item);
            updateCart();
            alert(`تم إضافة "${item.name}" إلى السلة بنجاح! 🌸`);
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            let box = document.getElementById('cartItems');
            let totalBox = document.getElementById('cartTotal');
            if(cart.length === 0) {
                box.innerHTML = 'السلة فارغة حالياً';
                totalBox.innerText = 'الإجمالي: 0 ج.م';
                return;
            }
            box.innerHTML = '';
            let sum = 0;
            cart.forEach(i => {
                sum += i.price;
                box.innerHTML += `<div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>${i.name}</span><span>${i.price} ج.م</span></div>`;
            });
            totalBox.innerText = `الإجمالي: ${sum} ج.م`;
        }

        function toggleModal(show) {
            document.getElementById('cartModal').style.display = show ? 'flex' : 'none';
        }

        function orderDone(e) {
            e.preventDefault();
            if(cart.length === 0) { alert('السلة فارغة!'); return; }
            let name = document.getElementById('cName').value;
            let gov = document.getElementById('cGov').value;
            let phone = document.getElementById('cPhone1').value;
            
            alert(`شكراً لكِ يا ${name}! تم تسجيل طلبك بنجاح وسيتم التواصل معكِ على الرقم (${phone}) وشحن الطلب إلى محافظة (${gov}) عن طريق المحفظة الإلكترونية. 🌸✨`);
            cart = [];
            updateCart();
            toggleModal(false);
        }

        filterPrs('All');
    </script>
</body>
</html>
